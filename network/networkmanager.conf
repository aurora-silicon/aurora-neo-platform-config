# MacBook Neo (J700) Wi-Fi: the mt7932-fullmac driver only accepts a station
# address change while it is idle, and randomised addresses are untested with
# its firmware. Keep the unit's own address for scans and connections.
[device-aurora-neo-mt7932]
match-device=driver:mt7932-fullmac
wifi.scan-rand-mac-address=no

[connection-aurora-neo-mt7932]
match-device=driver:mt7932-fullmac
wifi.cloned-mac-address=permanent
